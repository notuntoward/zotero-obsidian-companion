<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<groupbox
  onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window })"
>
  <label><html:h2>Keyboard Shortcuts</html:h2></label>
  <vbox>
    <hbox align="center">
      <label value="Create Lit Note:" style="width: 150px" />
      <html:input
        id="zotero-prefpane-__addonRef__-hotkeyCreateLitNote"
        type="text"
        placeholder="Click and press shortcut..."
        readonly="true"
        style="width: 200px"
      />
      <label
        id="zotero-prefpane-__addonRef__-warnCreateLitNote"
        style="color: red; margin-left: 10px"
        value=""
        hidden="true"
      />
    </hbox>
    <hbox align="center">
      <label value="Open Lit Note:" style="width: 150px" />
      <html:input
        id="zotero-prefpane-__addonRef__-hotkeyOpenLitNote"
        type="text"
        placeholder="Click and press shortcut..."
        readonly="true"
        style="width: 200px"
      />
      <label
        id="zotero-prefpane-__addonRef__-warnOpenLitNote"
        style="color: red; margin-left: 10px"
        value=""
        hidden="true"
      />
    </hbox>
    <hbox align="center">
      <label value="Sync Has-note Indicators:" style="width: 150px" />
      <html:input
        id="zotero-prefpane-__addonRef__-hotkeySyncTags"
        type="text"
        placeholder="Click and press shortcut..."
        readonly="true"
        style="width: 200px"
      />
      <label
        id="zotero-prefpane-__addonRef__-warnSyncTags"
        style="color: red; margin-left: 10px"
        value=""
        hidden="true"
      />
    </hbox>
    <hbox align="center">
      <label value="Toggle Left Pane:" style="width: 150px" />
      <html:input
        id="zotero-prefpane-__addonRef__-hotkeyToggleLeftPane"
        type="text"
        placeholder="Click and press shortcut..."
        readonly="true"
        style="width: 200px"
      />
      <label
        id="zotero-prefpane-__addonRef__-warnToggleLeftPane"
        style="color: red; margin-left: 10px"
        value=""
        hidden="true"
      />
    </hbox>
    <hbox align="center">
      <label value="Toggle Right Pane:" style="width: 150px" />
      <html:input
        id="zotero-prefpane-__addonRef__-hotkeyToggleRightPane"
        type="text"
        placeholder="Click and press shortcut..."
        readonly="true"
        style="width: 200px"
      />
      <label
        id="zotero-prefpane-__addonRef__-warnToggleRightPane"
        style="color: red; margin-left: 10px"
        value=""
        hidden="true"
      />
    </hbox>

    <hbox align="center">
      <label value="Regen BibTeX Key:" style="width: 150px" />
      <html:input
        id="zotero-prefpane-__addonRef__-hotkeyRegenBibtexKey"
        type="text"
        placeholder="Click and press shortcut..."
        readonly="true"
        style="width: 200px"
      />
      <label
        id="zotero-prefpane-__addonRef__-warnRegenBibtexKey"
        style="color: red; margin-left: 10px"
        value=""
        hidden="true"
      />
    </hbox>

    <hbox align="center">
      <label value="Copy Item Key:" style="width: 150px" />
      <html:input
        id="zotero-prefpane-__addonRef__-hotkeyCopyItemKey"
        type="text"
        placeholder="Click and press shortcut..."
        readonly="true"
        style="width: 200px"
      />
      <label
        id="zotero-prefpane-__addonRef__-warnCopyItemKey"
        style="color: red; margin-left: 10px"
        value=""
        hidden="true"
      />
    </hbox>
  </vbox>

  <html:hr />
  <html:label id="zotero-prefpane-__addonRef__-betterBibTeXStatus" />

  <html:hr />
  <label><html:h2 data-l10n-id="pref-title"></html:h2></label>
  <html:fieldset id="zotero-prefpane-__addonRef__-indicatorColors">
    <html:legend data-l10n-id="pref-indicator-color"></html:legend>
    <html:label data-l10n-id="pref-color-dark-gold">
      <html:input
        type="radio"
        name="indicatorColor"
        value="#C99700"
        data-l10n-id="pref-color-dark-gold"
      />
      <html:span aria-hidden="true" style="color: #c99700; font-size: 1.5em"
        >◆</html:span
      >
    </html:label>
    <html:label data-l10n-id="pref-color-gold">
      <html:input
        type="radio"
        name="indicatorColor"
        value="#E0B000"
        data-l10n-id="pref-color-gold"
      />
      <html:span aria-hidden="true" style="color: #e0b000; font-size: 1.5em"
        >◆</html:span
      >
    </html:label>
    <html:label data-l10n-id="pref-color-magenta">
      <html:input
        type="radio"
        name="indicatorColor"
        value="#D6249F"
        data-l10n-id="pref-color-magenta"
      />
      <html:span aria-hidden="true" style="color: #d6249f; font-size: 1.5em"
        >◆</html:span
      >
    </html:label>
    <html:label data-l10n-id="pref-color-brown">
      <html:input
        type="radio"
        name="indicatorColor"
        value="#8B5A2B"
        data-l10n-id="pref-color-brown"
      />
      <html:span aria-hidden="true" style="color: #8b5a2b; font-size: 1.5em"
        >◆</html:span
      >
    </html:label>
    <html:label data-l10n-id="pref-color-crimson">
      <html:input
        type="radio"
        name="indicatorColor"
        value="#B00020"
        data-l10n-id="pref-color-crimson"
      />
      <html:span aria-hidden="true" style="color: #b00020; font-size: 1.5em"
        >◆</html:span
      >
    </html:label>
  </html:fieldset>
  <html:p data-l10n-id="pref-indicator-description"></html:p>
  <html:hr />
  <label><html:h2 data-l10n-id="pref-review-title"></html:h2></label>
  <hbox align="center">
    <html:input
      type="checkbox"
      id="zotero-prefpane-__addonRef__-pauseAutomaticChecks"
      preference="pauseAutomaticChecks"
    />
    <html:label
      for="zotero-prefpane-__addonRef__-pauseAutomaticChecks"
      data-l10n-id="pref-pause-automatic-checks"
    />
  </hbox>
  <html:p data-l10n-id="pref-pause-automatic-checks-description"></html:p>

  <html:hr />
  <label><html:h2 data-l10n-id="pref-interface-title"></html:h2></label>
  <hbox align="center">
    <html:input
      type="checkbox"
      id="zotero-prefpane-__addonRef__-showPaneToggles"
      preference="showPaneToggles"
    />
    <html:label
      for="zotero-prefpane-__addonRef__-showPaneToggles"
      data-l10n-id="pref-show-pane-toggles"
    />
  </hbox>
</groupbox>
<vbox style="margin-top: 40px; opacity: 0.7">
  <html:label
    data-l10n-id="pref-help"
    data-l10n-args='{"time": "__buildTime__","name": "__addonName__","version":"__buildVersion__"}'
  ></html:label>
</vbox>
